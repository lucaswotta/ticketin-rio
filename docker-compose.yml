# Ambiente de desenvolvimento: docker compose up --build
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: popinrio
      POSTGRES_USER: ${DB_USER:-popinrio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-popinrio}
    ports:
      - "5432:5432"
    volumes:
      # A partir do PostgreSQL 18, o volume é montado em /var/lib/postgresql (não mais em .../data).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ticketing-service:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/popinrio
      DB_USER: ${DB_USER:-popinrio}
      DB_PASSWORD: ${DB_PASSWORD:-popinrio}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
