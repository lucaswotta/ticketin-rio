name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Formatação, testes unitários e de integração
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # verify = spotless:check + testes unitários (surefire) + *IT com Testcontainers (failsafe)
      - name: mvn verify
        run: |
          set -o pipefail
          ./mvnw -B -ntp verify 2>&1 | tee build.log

      # Erros do Maven viram anotações, visíveis no resumo da execução sem abrir o log inteiro.
      - name: Resumo dos erros
        if: failure()
        run: grep -E '^\[ERROR\]' build.log | head -30 | sed 's/^/::error::/' || true

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
