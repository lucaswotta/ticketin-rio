spring:
  application:
    name: ticketing-service
  threads:
    virtual:
      enabled: true
  datasource:
    # Valores padrão servem só para desenvolvimento local; em produção vêm do ambiente.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/popinrio}
    username: ${DB_USER:popinrio}
    password: ${DB_PASSWORD:popinrio}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5s
  jpa:
    # Schema é responsabilidade do Flyway. O Hibernate só confere se as entidades batem com ele.
    hibernate:
      ddl-auto: validate
    # Sem isso, a conexão com o banco fica presa durante a renderização da resposta inteira.
    open-in-view: false

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

pop-in-rio:
  reservation:
    hold-duration: ${RESERVATION_HOLD_DURATION:PT10M}
